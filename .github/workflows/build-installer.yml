name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - "cursor/**"
    paths-ignore:
      - "LeagueLoop_Installer.exe"
      - "README.md"

permissions:
  contents: write
  actions: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: PyInstaller and Inno Setup
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout installer repo
        uses: actions/checkout@v4

      - name: Read app pin
        id: pin
        run: |
          $pin = @{}
          foreach ($line in Get-Content app-source.env) {
            if ($line -match '^\s*#' -or $line -match '^\s*$') { continue }
            $parts = $line -split '=', 2
            $pin[$parts[0].Trim()] = $parts[1].Trim()
          }
          "APP_REPOSITORY=$($pin.APP_REPOSITORY)" >> $env:GITHUB_OUTPUT
          "APP_REF=$($pin.APP_REF)" >> $env:GITHUB_OUTPUT
          "APP_VERSION=$($pin.APP_VERSION)" >> $env:GITHUB_OUTPUT
          "PYTHON_VERSION=$($pin.PYTHON_VERSION)" >> $env:GITHUB_OUTPUT

      - name: Checkout LeagueLoop.DEV
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.APP_REPOSITORY }}
          ref: ${{ steps.pin.outputs.APP_REF }}
          path: app
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pin.outputs.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: deps/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r deps/requirements.txt

      - name: Build installer
        run: ./scripts/build-installer.ps1

      - name: Record installer metadata
        id: artifact
        run: |
          $path = "app/dist/LeagueLoop_Installer.exe"
          if (-not (Test-Path $path)) { throw "Missing $path" }
          $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
          $size = [math]::Round((Get-Item $path).Length / 1MB, 2)
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "size_mb=$size" >> $env:GITHUB_OUTPUT
          Write-Host "SHA256 $hash"
          Write-Host "Size $size MB"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeagueLoop_Installer
          path: app/dist/LeagueLoop_Installer.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish prerelease
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pin.outputs.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: LeagueLoop ${{ steps.pin.outputs.APP_VERSION }}
          prerelease: true
          draft: false
          make_latest: "false"
          fail_on_unmatched_files: true
          files: app/dist/LeagueLoop_Installer.exe
          body: |
            Windows installer for LeagueLoop `${{ steps.pin.outputs.APP_VERSION }}`.

            - App source: https://github.com/${{ steps.pin.outputs.APP_REPOSITORY }}/commit/${{ steps.pin.outputs.APP_REF }}
            - Installer workflow commit: ${{ github.sha }}
            - Python ${{ steps.pin.outputs.PYTHON_VERSION }}, PyInstaller ONEDIR, Inno Setup 6.7.0
            - Size: ${{ steps.artifact.outputs.size_mb }} MB
            - SHA256: `${{ steps.artifact.outputs.sha256 }}`

            Pre-release from the installer update branch. This workflow does not push to `main`.

      - name: Write job summary
        run: |
          @"
          ## LeagueLoop installer ${{ steps.pin.outputs.APP_VERSION }}

          - Download: ${{ steps.release.outputs.url }}
          - Size: ${{ steps.artifact.outputs.size_mb }} MB
          - SHA256: ``${{ steps.artifact.outputs.sha256 }}``
          - App commit: ``${{ steps.pin.outputs.APP_REF }}``
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
